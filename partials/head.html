<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Language. An English page opened from outside the site redirects to the visitor's saved
      // choice or first browser language that the site has. Translated URLs never redirect, so
      // shared links open as sent. A language picked in the menu is remembered, and the menu
      // closes on an outside click, when focus leaves it, or on Escape.
      (function (current, codes, autoRedirect) {
        var saved = null;
        try {
          saved = localStorage.getItem('lang');
        } catch (e) {}
        if (autoRedirect && document.referrer.indexOf(location.origin + '/') !== 0) {
          var target = codes.indexOf(saved) >= 0 ? saved : null;
          var preferred = navigator.languages || [navigator.language];
          for (var i = 0; !target && i < preferred.length; i++) {
            var code = String(preferred[i] || '').toLowerCase().split('-')[0];
            if (codes.indexOf(code) >= 0) target = code;
          }
          if (target && target !== current) {
            window.langRedirect = true;
            // Hand the original referrer (for example LinkedIn) to analytics on the translated page.
            try {
              sessionStorage.setItem('langReferrer', document.referrer);
            } catch (e) {}
            location.replace('/' + target + location.pathname + location.search + location.hash);
            return;
          }
        }
        function closeIfOutside(event) {
          var menu = document.querySelector('.lang-menu[open]');
          if (menu && !menu.contains(event.target)) menu.removeAttribute('open');
        }
        document.addEventListener('click', function (event) {
          var link = event.target.closest ? event.target.closest('a[data-lang]') : null;
          if (link) {
            try {
              localStorage.setItem('lang', link.getAttribute('data-lang'));
            } catch (e) {}
            if (location.hash) link.hash = location.hash;
          }
          closeIfOutside(event);
        });
        document.addEventListener('focusin', closeIfOutside);
        document.addEventListener('keydown', function (event) {
          var menu = document.querySelector('.lang-menu[open]');
          if (menu && event.key === 'Escape') {
            menu.removeAttribute('open');
            menu.querySelector('summary').focus();
          }
        });
      })('{{lang}}', {{langCodes}}, {{autoRedirect}});
    </script>
    <meta name="author" content="Azizjon Kasimov" />

    <!-- Google Analytics (GA4): visits, outbound clicks, and referrers. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1FK1J6QDJP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // No page view for an English page that is redirecting to a translation. The translated page
      // reports the referrer the visitor had before the redirect, not the English page.
      if (!window.langRedirect) {
        var langReferrer = null;
        try {
          langReferrer = sessionStorage.getItem('langReferrer');
          sessionStorage.removeItem('langReferrer');
        } catch (e) {}
        gtag('js', new Date());
        gtag('config', 'G-1FK1J6QDJP', langReferrer ? { page_referrer: langReferrer } : {});
      }
    </script>
